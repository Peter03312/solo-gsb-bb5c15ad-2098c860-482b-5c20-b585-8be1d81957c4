services:
  sop-history:
    build: .
    image: sop-history:1.0
    container_name: sop-history
    ports:
      # 宿主机端口:容器端口 —— 访问 http://localhost:8080
      - "8080:8080"
    environment:
      DB_PATH: /data/sop.db          # SQLite 数据库文件
      APP_HOST: 0.0.0.0
      APP_PORT: "8080"               # 容器内监听端口（与左侧映射对齐）
      DB_TIMEOUT: "10"               # 写事务等锁超时（秒）
    volumes:
      - sop-data:/data               # 数据库持久化命名卷
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8080/healthz').status==200 else 1)"]
      interval: 10s
      timeout: 3s
      retries: 5

volumes:
  sop-data:
